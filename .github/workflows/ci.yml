name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
      - uses: pre-commit/action@v3.0.1

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4.2.2

      - name: Setup pixi environment
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: docs
          frozen: true

      # `-W --keep-going`: a warning anywhere fails the build, and so does a cell that
      # raises (nb_execution_raise_on_error).
      - name: Build the docs
        run: pixi run -e docs docs

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # test-py3XX vary python with every optional dependency installed; test-minimal
        # has none of them, which is what proves excelizarr never needs calamine or
        # icechunk to work.
        environment:
          - test-py312
          - test-py313
          - test-minimal
    env:
      HYPOTHESIS_PROFILE: ci

    steps:
      - name: Checkout source
        uses: actions/checkout@v4.2.2

      - name: Setup pixi environment
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: ${{ matrix.environment }}
          frozen: true

      - name: Run tests and generate coverage report
        run: pixi run -e ${{ matrix.environment }} test-cov

      - name: Upload code coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.codecov_token }}
          files: ./coverage.xml
